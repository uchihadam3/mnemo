name: Gerar instaladores
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Construir
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mnemo-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
          if-no-files-found: ignore
      - name: Ler versão
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Anexar ao release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: MNEMO ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: |
            🃏 **MNEMO — o roguelike da memória**

            - **Windows:** baixe `MNEMO-*-Instalador.exe` (ou a versão portátil `*-portatil.exe`).
              Se o Windows avisar sobre app não reconhecido: *Mais informações → Executar assim mesmo*.
            - **Linux:** `.AppImage` ou `.deb`
            - **macOS:** `.dmg`
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
